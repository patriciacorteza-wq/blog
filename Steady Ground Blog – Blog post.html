  <title>Steady Ground Blog</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading Steady Ground Blog...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<title>Steady Ground Blog<\u002Ftitle>\n<script src=\"f813150b-8f01-4a09-a1a1-fab675a28fb4\"><\u002Fscript>\n<meta name=\"hz:slide-selector\" content=\"[data-canvas-width]\"><meta name=\"hz:canvas-width\" content=\"1280\"><meta name=\"hz:canvas-height\" content=\"8000\"><\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&amp;family=Source+Sans+3:ital,wght@0,400;0,600;1,400&amp;display=swap\">\n<style>\nbody{margin:0;background:#FFF6F9}\nhtml{scroll-behavior:smooth}\na{color:#B02A63}a:hover{color:#7E1B45}\n.navlink{color:#2E1A28;text-decoration:none;font-weight:600;padding:12px 4px}\n.navlink:hover{color:#B02A63;text-decoration:underline}\nbutton:focus-visible,a:focus-visible{outline:3px solid #B02A63;outline-offset:2px}\n.opt:hover{border-color:#B02A63}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"background:#FFF6F9;color:#2E1A28;font-family:'Source Sans 3',system-ui,sans-serif;font-size:19px;line-height:1.6\" data-canvas-width=\"1280\" data-canvas-height=\"8000\" data-document-role=\"page\" data-label=\"Blog post\">\n\n<!-- MASTHEAD -->\n<header style=\"background:#FFFFFF;border-bottom:1px solid #F0D3DF\">\n<div style=\"background:#FCE4EE;text-align:center;padding:8px 24px;font-size:15px;color:#5A3C4F\">Honest talk on love, boundaries &amp; self-respect<\u002Fdiv>\n<div style=\"max-width:1120px;margin:0 auto;padding:28px 24px 8px;box-sizing:border-box;text-align:center\">\n<a href=\"#top\" style=\"display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:#2E1A28;font-family:'Playfair Display',serif;font-weight:700;font-style:italic;font-size:clamp(34px,5vw,48px);line-height:1.1\">\n<svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2 0 3.6 1 5.3 3 1.7-2 3.3-3 5.3-3 3.700 0 5.800 3.800 4.300 7.200C19.500 16.400 12 21 12 21z\" fill=\"#B02A63\"><\u002Fpath><\u002Fsvg>\n<span>Steady Ground<\u002Fspan>\n<\u002Fa>\n<\u002Fdiv>\n<nav aria-label=\"Main\" style=\"max-width:1120px;margin:0 auto;padding:4px 24px 12px;box-sizing:border-box;display:flex;flex-wrap:wrap;justify-content:center;gap:0 28px;font-size:16px;letter-spacing:0.06em;text-transform:uppercase\">\n<a class=\"navlink\" href=\"#top\">Home<\u002Fa>\n<a class=\"navlink\" href=\"#top\">Relationships<\u002Fa>\n<a class=\"navlink\" href=\"#top\">Self-love<\u002Fa>\n<a class=\"navlink\" href=\"#top\">Wellness<\u002Fa>\n<a class=\"navlink\" href=\"#authors\">About us<\u002Fa>\n<\u002Fnav>\n<\u002Fheader>\n\n<main id=\"top\">\n\n<!-- POST HEADER -->\n<article>\n<header style=\"max-width:900px;margin:0 auto;padding:56px 24px 32px;box-sizing:border-box;text-align:center\">\n<p style=\"margin:0 0 20px;font-size:15px;color:#6A4A5E\"><a href=\"#top\" style=\"color:#6A4A5E\">Home<\u002Fa> &nbsp;/&nbsp; <a href=\"#top\" style=\"color:#6A4A5E\">Relationships<\u002Fa><\u002Fp>\n<p style=\"margin:0 0 20px\"><span style=\"display:inline-block;padding:6px 16px;border-radius:999px;background:#FCE4EE;color:#7E1B45;font-size:14px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase\">Relationship health<\u002Fspan><\u002Fp>\n<h1 style=\"margin:0 0 28px;font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(34px,5vw,56px);line-height:1.12;letter-spacing:-0.01em\">“Is It a Red Flag or Am I Overthinking?” 7 Signs You're in a Toxic Relationship<\u002Fh1>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 16px;font-size:17px;color:#5A3C4F\">\n<div style=\"display:flex\">\n<span aria-hidden=\"true\" style=\"display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:#B02A63;color:#FFFFFF;font-weight:600;font-size:16px;border:3px solid #FFF6F9\">PC<\u002Fspan>\n<span aria-hidden=\"true\" style=\"display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:#5A2D9C;color:#FFFFFF;font-weight:600;font-size:16px;border:3px solid #FFF6F9;margin-left:-12px\">JJ<\u002Fspan>\n<\u002Fdiv>\n<span>By <strong style=\"color:#2E1A28\">Patricia Corteza<\u002Fstrong> &amp; <strong style=\"color:#2E1A28\">Janine Jarlos<\u002Fstrong><\u002Fspan>\n<span aria-hidden=\"true\">·<\u002Fspan>\n<span>October 28, 2026<\u002Fspan>\n<\u002Fdiv>\n<\u002Fheader>\n<div style=\"max-width:960px;margin:0 auto;padding:0 24px 8px;box-sizing:border-box\">\n<img src=\"fa8545af-6322-4437-8c55-bbbba0b1cdf3\" alt=\"Silhouettes of two people arguing in a doorway\" style=\"display:block;width:100%;height:auto;border-radius:28px;border:6px solid #FFFFFF;box-sizing:border-box;box-shadow:0 12px 32px rgba(176,42,99,0.18)\">\n<\u002Fdiv>\n\n<!-- INTRO -->\n<section style=\"max-width:760px;margin:0 auto;padding:40px 24px 40px;box-sizing:border-box\">\n<p style=\"margin:0 0 24px;font-family:'Playfair Display',serif;font-style:italic;font-size:24px;line-height:1.5;color:#5A3C4F\">Have you ever been in a situation where you find yourself making excuses for someone’s bad behavior, wondering about being too sensitive, or asking your friends whether you’re just overreacting?<\u002Fp>\n<p style=\"margin:0 0 20px\">Well, it’s not always easy to tell when something is <em>genuinely<\u002Fem> wrong in a relationship, and one bad day or disagreement doesn’t make a relationship toxic. But if there are repeated patterns of manipulation, disrespect, and controlling behavior, you might want to reflect on it.<\u002Fp>\n<p style=\"margin:0 0 32px\">So, how do you tell the difference between a normal relationship problem and something more serious? Let's talk about seven red flags to look out for, what they can look like in everyday life, and how to know when it might be time to walk away.<\u002Fp>\n<nav aria-label=\"In this post\" style=\"background:#FFFFFF;border:1px solid #F0D3DF;border-radius:20px;padding:24px 28px\">\n<p style=\"margin:0 0 10px;font-family:'Playfair Display',serif;font-weight:700;font-size:22px\">In this post<\u002Fp>\n<ul style=\"margin:0;padding-left:22px;font-size:18px\">\n<li style=\"margin:0 0 4px\"><a href=\"#difference\">Red flags vs. normal relationship problems<\u002Fa><\u002Fli>\n<li style=\"margin:0 0 4px\"><a href=\"#flags\">The 7 red flags you shouldn’t ignore<\u002Fa><\u002Fli>\n<li style=\"margin:0 0 4px\"><a href=\"#walk-away\">When is it time to walk away?<\u002Fa><\u002Fli>\n<li style=\"margin:0 0 4px\"><a href=\"#check-in\">Relationship check-in quiz<\u002Fa><\u002Fli>\n<li style=\"margin:0\"><a href=\"#support\">Learn more &amp; get support<\u002Fa><\u002Fli>\n<\u002Ful>\n<\u002Fnav>\n<\u002Fsection>\n\n<!-- DIFFERENCE -->\n<section id=\"difference\" style=\"background:#FFFFFF;border-top:1px solid #F0D3DF;border-bottom:1px solid #F0D3DF\">\n<div style=\"max-width:1120px;margin:0 auto;padding:72px 24px;box-sizing:border-box\">\n<h2 style=\"margin:0 0 20px;max-width:760px;font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(28px,3.6vw,40px);line-height:1.15;letter-spacing:-0.01em\">Red Flags vs. Normal Relationship Problems: How Can You Tell the Difference?<\u002Fh2>\n<div style=\"max-width:760px\">\n<p style=\"margin:0 0 16px\">No relationship is perfect. Every couple gets into misunderstandings, says the wrong things, or goes to bed upset. That’s part of being in a relationship, and it doesn’t mean yours is toxic. What matters isn’t when you have disagreements, but how you treat each other and respond to one another when those fights happen.<\u002Fp>\n<p style=\"margin:0 0 16px\">One is when someone misses a text from you – relax. Maybe they just had a hectic day and forgot to respond. That happens. But if the purpose is to intentionally ignore it and make you feel bad, now that’s a different story.<\u002Fp>\n<p style=\"margin:0 0 36px\">According to loveisrespect.org, healthy relationships depend on communication, respect, trust, and boundaries. These allow both people to work through disagreements without one of you feeling small, intimidated, or scared.<\u002Fp>\n<\u002Fdiv>\n<p style=\"margin:0 0 16px;font-weight:600\">Here’s a simple way to think about it:<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:20px\">\n<div style=\"flex:1 1 280px;min-width:0;background:#FCE4EE;border-radius:16px;padding:28px;box-sizing:border-box\">\n<p style=\"margin:0 0 8px;font-size:14px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#B02A63\">Normal<\u002Fp>\n<p style=\"margin:0\">You can both express yourself, listen to each other, apologize when needed, and work toward a solution.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1 1 280px;min-width:0;background:#F1E8FB;border-radius:16px;padding:28px;box-sizing:border-box\">\n<p style=\"margin:0 0 8px;font-size:14px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#5A2D9C\">Unhealthy patterns<\u002Fp>\n<p style=\"margin:0\">One or both of you repeatedly dismiss each other’s feelings, avoid taking responsibility, or use guilt to shut down difficult conversations.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1 1 280px;min-width:0;background:#2E1A28;color:#FFFFFF;border-radius:16px;padding:28px;box-sizing:border-box\">\n<p style=\"margin:0 0 8px;font-size:14px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#F7B6D2\">Potentially abusive behavior<\u002Fp>\n<p style=\"margin:0\">Your partner exerting their power and control through threats, coercion, isolation, etc.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"max-width:760px;margin-top:36px\">\n<p style=\"margin:0 0 16px\">After the argument, observe what happens and ask yourself: Can we talk about what happened? Do we both try to understand each other? Or am I always the one apologizing just to make the conflict stop?<\u002Fp>\n<p style=\"margin:0\">No one handles every situation perfectly. But a relationship should not leave you hanging and constantly hurt, unheard, and afraid to speak up.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- FLAGS -->\n<section id=\"flags\" style=\"max-width:1120px;margin:0 auto;padding:80px 24px 32px;box-sizing:border-box\">\n<h2 style=\"margin:0 0 20px;font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(28px,3.6vw,40px);line-height:1.15;letter-spacing:-0.01em\">7 Toxic Relationship Red Flags You Shouldn’t Ignore<\u002Fh2>\n<div style=\"max-width:760px;margin-bottom:48px\">\n<p style=\"margin:0 0 16px\">Sometimes, the hardest part is recognizing that the normal that you’ve gotten used to is not really okay. You can love someone and realize they’re hurting you.<\u002Fp>\n<p style=\"margin:0\">These red flags are not meant to label someone based on one bad moment – they’re meant to help you recognize patterns that may be worth paying attention to, even the smallest ones.<\u002Fp>\n<\u002Fdiv>\n\n<!-- flag 1 -->\n<article style=\"display:flex;flex-wrap:wrap;gap:20px 32px;padding:40px 0;border-top:1px solid #F0D3DF\">\n<div style=\"flex:0 0 64px\"><span style=\"display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:#B02A63;color:#FFFFFF;font-family:'Playfair Display',serif;font-weight:700;font-size:26px\">1<\u002Fspan><\u002Fdiv>\n<div style=\"flex:1 1 360px;min-width:0;max-width:760px\">\n<h3 style=\"margin:0 0 16px;font-family:'Playfair Display',serif;font-weight:700;font-size:28px;line-height:1.2\">They dismiss or invalidate your feelings<\u002Fh3>\n<p style=\"margin:0 0 14px\">Imagine telling your partner that they did something that hurt you, only to hear that you’re dramatic, overly sensitive, or unreasonable.<\u002Fp>\n<p style=\"margin:0 0 14px\">Of course, there might be times when your partner doesn’t immediately understand why something upsets you. Sometimes, they feel that they are being attacked, which is why they do not immediately understand why it upsets you. That’s normal. What matters is whether they're willing to listen and try to understand where you're coming from.<\u002Fp>\n<p style=\"margin:0 0 20px\">But if it happens repeatedly, it trains you that your feelings are an issue. You stop sharing because it’s easier.<\u002Fp>\n<div style=\"background:#F1E8FB;border-radius:12px;padding:18px 22px\"><p style=\"margin:0\"><strong style=\"color:#5A2D9C\">Watch out for:<\u002Fstrong> feeling guilty whenever you have a concern. And the discussions about how you feel become discussions about why you shouldn’t.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Farticle>\n\n<!-- flag 2 -->\n<article style=\"display:flex;flex-wrap:wrap;gap:20px 32px;padding:40px 0;border-top:1px solid #F0D3DF\">\n<div style=\"flex:0 0 64px\"><span style=\"display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:#B02A63;color:#FFFFFF;font-family:'Playfair Display',serif;font-weight:700;font-size:26px\">2<\u002Fspan><\u002Fdiv>\n<div style=\"flex:1 1 360px;min-width:0;max-width:760px\">\n<h3 style=\"margin:0 0 16px;font-family:'Playfair Display',serif;font-weight:700;font-size:28px;line-height:1.2\">They’re controlling &amp; unreasonably jealous<\u002Fh3>\n<p style=\"margin:0 0 14px\">Everyone gets a little jealous from time to time. It becomes a red flag when they use jealousy as a reason to control your choices.<\u002Fp>\n<p style=\"margin:0 0 14px\">Maybe they ask about every person you talk to, or want your passwords, or are upset when you see friends. And for some people, they see it as a sign of how much they care about you – it’s not.<\u002Fp>\n<p style=\"margin:0 0 20px\">A healthy relationship leaves room for privacy or independence outside the relationship. According to The National Domestic Violence Hotline, controlling who your partner sees, where they go, and what they do can be warning signs of abuse.<\u002Fp>\n<div style=\"background:#F1E8FB;border-radius:12px;padding:18px 22px\"><p style=\"margin:0\"><strong style=\"color:#5A2D9C\">Watch out for:<\u002Fstrong> feeling the need to ask for permission to make everyday decisions, constantly having to explain where you’ve been, or avoiding activities you’d enjoy doing because you’re afraid of how they’ll react. If keeping the peace means sacrificing your freedom, it’s worth taking a closer look at the relationship.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Farticle>\n\n<!-- flag 3 -->\n<article style=\"display:flex;flex-wrap:wrap;gap:20px 32px;padding:40px 0;border-top:1px solid #F0D3DF\">\n<div style=\"flex:0 0 64px\"><span style=\"display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:#B02A63;color:#FFFFFF;font-family:'Playfair Display',serif;font-weight:700;font-size:26px\">3<\u002Fspan><\u002Fdiv>\n<div style=\"flex:1 1 360px;min-width:0;max-width:760px\">\n<h3 style=\"margin:0 0 16px;font-family:'Playfair Display',serif;font-weight:700;font-size:28px;line-height:1.2\">They make you doubt your own reality<\u002Fh3>\n<p style=\"margin:0 0 14px\">Was there ever a time when you left an argument feeling confused, even though you felt clear about what happened going into the argument? This is what a lot of people have talked about in recent years – gaslighting.<\u002Fp>\n<p style=\"margin:0 0 14px\">Gaslighting is a form of psychological manipulation in which a person makes you doubt your own thoughts, memories, or understanding of events. Your partner might insist you never said something you clearly remember saying, deny that an incident ever happened, or turn the situation around until you end up questioning yourself.<\u002Fp>\n<div style=\"background:#F1E8FB;border-radius:12px;padding:18px 22px\"><p style=\"margin:0\"><strong style=\"color:#5A2D9C\">Keep in mind:<\u002Fstrong> two people can remember a conversation differently. One disagreement over what was said doesn't automatically mean someone is gaslighting you. The concern is a recurring pattern of denial, distortion, or blame that leaves you increasingly unsure of your own experiences.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Farticle>\n\n<!-- flag 4 -->\n<article style=\"display:flex;flex-wrap:wrap;gap:20px 32px;padding:40px 0;border-top:1px solid #F0D3DF\">\n<div style=\"flex:0 0 64px\"><span style=\"display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:#B02A63;color:#FFFFFF;font-family:'Playfair Display',serif;font-weight:700;font-size:26px\">4<\u002Fspan><\u002Fdiv>\n<div style=\"flex:1 1 360px;min-width:0;max-width:760px\">\n<h3 style=\"margin:0 0 16px;font-family:'Playfair Display',serif;font-weight:700;font-size:28px;line-height:1.2\">They never take responsibility<\u002Fh3>\n<p style=\"margin:0 0 14px\">Everyone makes mistakes. In a healthy relationship, both people should be able to admit when they've hurt each other, apologize, and learn from what happened.<\u002Fp>\n<p style=\"margin:0 0 14px\">The red flag is if your partner avoids it all the time. They blame you for it, change the subject, or apologize only for the sake of ending the argument without making any effort to change.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:16px;margin:8px 0 20px\">\n<div style=\"flex:1 1 280px;min-width:0;background:#FFFFFF;border:1px solid #F0D3DF;border-radius:12px;padding:18px 22px;box-sizing:border-box\"><p style=\"margin:0 0 6px;font-size:14px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#5A2D9C\">Points at your reaction<\u002Fp><p style=\"margin:0;font-style:italic\">“I’m sorry you were upset that I yelled.”<\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 280px;min-width:0;background:#FFFFFF;border:1px solid #F0D3DF;border-radius:12px;padding:18px 22px;box-sizing:border-box\"><p style=\"margin:0 0 6px;font-size:14px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#B02A63\">Owns their behavior<\u002Fp><p style=\"margin:0;font-style:italic\">“I’m sorry I spoke to you that way. I understand how you could be hurt.”<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:0\">You don't need a perfect partner. You do need someone who's willing to own their actions and make a genuine effort to do better.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<!-- flag 5 -->\n<article style=\"display:flex;flex-wrap:wrap;gap:20px 32px;padding:40px 0;border-top:1px solid #F0D3DF\">\n<div style=\"flex:0 0 64px\"><span style=\"display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:#B02A63;color:#FFFFFF;font-family:'Playfair Display',serif;font-weight:700;font-size:26px\">5<\u002Fspan><\u002Fdiv>\n<div style=\"flex:1 1 360px;min-width:0;max-width:760px\">\n<h3 style=\"margin:0 0 16px;font-family:'Playfair Display',serif;font-weight:700;font-size:28px;line-height:1.2\">They attempt to isolate you<\u002Fh3>\n<p style=\"margin:0 0 14px\">At the beginning of a relationship, it’s natural to want to spend all your time together. But it becomes toxic and a red flag when your partner starts discouraging you – or actively preventing you – from spending time with other people, especially your friends, or people they might feel threatened by.<\u002Fp>\n<p style=\"margin:0 0 14px\">They make a fuss when you see friends, make you feel guilty for visiting your family, and suggest that your close ones are trying to ruin everything for you.<\u002Fp>\n<p style=\"margin:0 0 20px\">A healthy relationship makes room for a life outside your romantic relationship. You can love your partner deeply while still having friends, family, hobbies, and personal space. You can have a partner who’s extremely important to you without becoming your entire world.<\u002Fp>\n<div style=\"background:#F1E8FB;border-radius:12px;padding:18px 22px\"><p style=\"margin:0\"><strong style=\"color:#5A2D9C\">Look out for:<\u002Fstrong> slowly losing contact with people you care about because your partner gets upset about your relationship with them, often feeling guilty for spending time apart, or realizing you have fewer people to turn to when you need support.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Farticle>\n\n<!-- flag 6 -->\n<article style=\"display:flex;flex-wrap:wrap;gap:20px 32px;padding:40px 0;border-top:1px solid #F0D3DF\">\n<div style=\"flex:0 0 64px\"><span style=\"display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:#B02A63;color:#FFFFFF;font-family:'Playfair Display',serif;font-weight:700;font-size:26px\">6<\u002Fspan><\u002Fdiv>\n<div style=\"flex:1 1 360px;min-width:0;max-width:760px\">\n<h3 style=\"margin:0 0 16px;font-family:'Playfair Display',serif;font-weight:700;font-size:28px;line-height:1.2\">They constantly push your boundaries<\u002Fh3>\n<p style=\"margin:0 0 14px\">Your boundaries are the limits that keep your comfort, privacy, values and space safe. These can be anything from needing your own space and deciding what you share online to setting limits around physical affection and intimacy.<\u002Fp>\n<p style=\"margin:0 0 14px\">For example, your partner might insist on checking your phone even when you’ve said you’re uncomfortable with it. Or they might keep pressuring you into physical intimacy even after you’ve said no. You don’t have to give up your privacy and self-respect, or go along with something you’re not comfortable with just to keep someone. That isn’t a healthy compromise.<\u002Fp>\n<p style=\"margin:0 0 20px\">Love Is Respect’s guide to healthy relationships highlights the importance of mutual respect and shares a list of respect basics, including respect for your boundaries, space and privacy.<\u002Fp>\n<div style=\"background:#F1E8FB;border-radius:12px;padding:18px 22px\"><p style=\"margin:0\"><strong style=\"color:#5A2D9C\">Look out for:<\u002Fstrong> agreeing to things you don’t actually want just to avoid conflict, feeling guilty whenever you say no, or not bothering with setting boundaries because you’re afraid of how your partner might react.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Farticle>\n\n<!-- flag 7 -->\n<article style=\"display:flex;flex-wrap:wrap;gap:20px 32px;padding:40px 0;border-top:1px solid #F0D3DF;border-bottom:1px solid #F0D3DF\">\n<div style=\"flex:0 0 64px\"><span style=\"display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:#B02A63;color:#FFFFFF;font-family:'Playfair Display',serif;font-weight:700;font-size:26px\">7<\u002Fspan><\u002Fdiv>\n<div style=\"flex:1 1 360px;min-width:0;max-width:760px\">\n<h3 style=\"margin:0 0 16px;font-family:'Playfair Display',serif;font-weight:700;font-size:28px;line-height:1.2\">You feel anxious, drained, or afraid around them<\u002Fh3>\n<p style=\"margin:0 0 14px\">Sometimes, the biggest indicator is how you feel around your partner. You find yourself practicing in your head what you’re going to say. You tense up when their mood changes. You replay arguments over and over, wondering what you did wrong. You’re not able to relax and be yourself, but instead are managing your words.<\u002Fp>\n<p style=\"margin:0 0 20px\">Stress doesn’t automatically equal toxic. It’s life, miscommunications, and all kinds of mess-ups. What matters is whether these feelings are occasional or have become a recurring part of your relationship. If you regularly feel small, anxious, or emotionally exhausted around your partner, it’s worth asking yourself why.<\u002Fp>\n<div style=\"background:#F1E8FB;border-radius:12px;padding:18px 22px\"><p style=\"margin:0\"><strong style=\"color:#5A2D9C\">Look for:<\u002Fstrong> walking on eggshells, having trouble being honest, or noticing that you’ve lost some self-confidence and independence since getting together.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Farticle>\n<\u002Fsection>\n\n<!-- WALK AWAY -->\n<section id=\"walk-away\" style=\"max-width:1120px;margin:0 auto;padding:72px 24px 48px;box-sizing:border-box\">\n<h2 style=\"margin:0 0 20px;font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(28px,3.6vw,40px);line-height:1.15;letter-spacing:-0.01em\">When Is It Time to Walk Away?<\u002Fh2>\n<div style=\"display:flex;flex-wrap:wrap;gap:40px;align-items:center;margin-bottom:48px\">\n<div style=\"flex:1 1 420px;min-width:0\">\n<p style=\"margin:0 0 16px\">It’s easy to make excuses for actions done by someone you care about. Maybe they’re stressed. Maybe they didn’t mean to hurt you. Maybe things will get better if you’re just a little more patient.<\u002Fp>\n<p style=\"margin:0 0 16px\">And sometimes, things do get better. When both partners are willing to listen, take responsibility, and make meaningful changes, relationship problems can be worked through. But you cannot repair a relationship by yourself, and love alone cannot make an unhealthy dynamic disappear.<\u002Fp>\n<p style=\"margin:0;font-weight:600\">How do you know when it might be time to go? Ask yourself three questions.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1 1 320px;min-width:0;max-width:440px\">\n<img src=\"cda986fc-6d22-4698-ab94-d9cc94cc4438\" alt=\"A woman looking down in a city street while a man walks behind her\" style=\"display:block;width:100%;height:auto;border-radius:20px\">\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:20px\">\n<div style=\"flex:1 1 300px;min-width:0;background:#FFFFFF;border:1px solid #F0D3DF;border-radius:16px;padding:28px;box-sizing:border-box\">\n<p style=\"margin:0 0 8px;font-size:14px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#B02A63\">Question 1<\u002Fp>\n<h3 style=\"margin:0 0 12px;font-family:'Playfair Display',serif;font-weight:700;font-size:24px;line-height:1.2\">Is the behavior actually changing?<\u002Fh3>\n<p style=\"margin:0 0 12px;font-size:18px\">Has your partner acknowledged the issue and made consistent and obvious changes? Or are the apologies for fighting followed by the same behavior days later?<\u002Fp>\n<p style=\"margin:0;font-size:18px\">You don't need to expect perfection, but you should be able to see genuine effort and progress, not just hear promises that things will be different.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1 1 300px;min-width:0;background:#FFFFFF;border:1px solid #F0D3DF;border-radius:16px;padding:28px;box-sizing:border-box\">\n<p style=\"margin:0 0 8px;font-size:14px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#B02A63\">Question 2<\u002Fp>\n<h3 style=\"margin:0 0 12px;font-family:'Playfair Display',serif;font-weight:700;font-size:24px;line-height:1.2\">Are you safe to be honest?<\u002Fh3>\n<p style=\"margin:0 0 12px;font-size:18px\">Can you tell your partner when something hurts you? Can you disagree, ask for respect, or set a boundary without worrying about being threatened, humiliated, punished, or having your words used against you?<\u002Fp>\n<p style=\"margin:0;font-size:18px\">If you constantly have to monitor your words or hide your feelings to avoid their anger, take that seriously. You deserve to feel safe expressing yourself.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1 1 300px;min-width:0;background:#FFFFFF;border:1px solid #F0D3DF;border-radius:16px;padding:28px;box-sizing:border-box\">\n<p style=\"margin:0 0 8px;font-size:14px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#B02A63\">Question 3<\u002Fp>\n<h3 style=\"margin:0 0 12px;font-family:'Playfair Display',serif;font-weight:700;font-size:24px;line-height:1.2\">Are you still able to be yourself?<\u002Fh3>\n<p style=\"margin:0 0 12px;font-size:18px\">Think about the person you were before the relationship, and the person you are now. Can you still maintain friendships, pursue your goals, enjoy your hobbies, and make decisions for yourself?<\u002Fp>\n<p style=\"margin:0;font-size:18px\">A healthy relationship can change you in positive ways, but it shouldn't require you to abandon your identity, independence, or peace of mind.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- LEAVE -->\n<section style=\"max-width:1120px;margin:0 auto;padding:24px 24px 88px;box-sizing:border-box\">\n<div style=\"background:#2E1A28;color:#FFFFFF;border-radius:24px;padding:clamp(28px,5vw,56px);box-sizing:border-box\">\n<h2 style=\"margin:0 0 20px;max-width:760px;font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(28px,3.6vw,40px);line-height:1.15\">You Can Love Someone and Still Choose to Leave<\u002Fh2>\n<div style=\"max-width:760px\">\n<p style=\"margin:0 0 16px\">Love does not excuse harm. You can care about someone and recognize it’s not a good fit for you. You don’t need them to be a bad person before you want something different.<\u002Fp>\n<p style=\"margin:0 0 16px\">And remember: you don’t need to check off every single red flag on this list for it to be “something”. A single incident involving physical violence, sexual coercion, or a serious threat can be enough to warrant immediate concern, even if it’s just once. There is no need to count warning signs or wait for a pattern to break out before taking your safety seriously.<\u002Fp>\n<p style=\"margin:0 0 16px\">Ultimately, deciding what to do is personal, and you deserve support as you work through it. Whether you're considering working on the relationship, seeking professional guidance, or preparing to leave, your emotional and physical safety should remain a priority.<\u002Fp>\n<p style=\"margin:0;font-family:'Playfair Display',serif;font-weight:700;font-size:24px;line-height:1.3;color:#F7B6D2\">You deserve a relationship where love doesn't come at the expense of your well-being.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- QUIZ -->\n<section id=\"check-in\" style=\"background:#FCE4EE;border-top:1px solid #F2BDD3;border-bottom:1px solid #F2BDD3\">\n<div style=\"max-width:880px;margin:0 auto;padding:80px 24px;box-sizing:border-box\">\n<p style=\"margin:0 0 12px;font-size:15px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#B02A63\">Relationship check-in quiz<\u002Fp>\n<h2 style=\"margin:0 0 16px;font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(28px,3.6vw,40px);line-height:1.15;letter-spacing:-0.01em\">How are things feeling lately?<\u002Fh2>\n<p style=\"margin:0 0 12px\">Ten statements drawn from the red flags above. For each one, choose how often it’s true in your relationship right now. It takes a couple of minutes.<\u002Fp>\n<p style=\"margin:0 0 36px;font-size:17px;color:#5A3C4F\">This is a reflection tool, not a diagnosis. Your answers aren’t saved or sent anywhere. If you ever feel unsafe, skip the quiz and go straight to <a href=\"#support\">support<\u002Fa>.<\u002Fp>\n\n<div style=\"display:flex;flex-direction:column;gap:20px\">\n<sc-for list=\"{{questions}}\" as=\"q\" hint-placeholder-count=\"3\">\n<fieldset style=\"margin:0;border:0;background:#FFFFFF;border-radius:16px;padding:24px 24px 28px;min-width:0\">\n<legend style=\"padding:0;float:left;width:100%;margin:0 0 16px;font-weight:600;font-size:19px;line-height:1.45\"><span style=\"color:#B02A63;margin-right:8px\">{{q.num}}.<\u002Fspan>{{q.text}}<\u002Flegend>\n<div style=\"clear:both;display:flex;flex-wrap:wrap;gap:10px\">\n<sc-for list=\"{{q.options}}\" as=\"opt\" hint-placeholder-count=\"4\">\n<sc-if value=\"{{opt.pressed}}\" hint-placeholder-val=\"{{ false }}\">\n<button type=\"button\" aria-pressed=\"true\" sc-camel-on-click=\"{{opt.pick}}\" style=\"min-height:44px;padding:0 20px;border-radius:999px;border:2px solid #B02A63;background:#B02A63;color:#FFFFFF;font:inherit;font-size:16px;font-weight:600;cursor:pointer\">{{opt.label}}<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{opt.unpressed}}\" hint-placeholder-val=\"{{ true }}\">\n<button type=\"button\" class=\"opt\" aria-pressed=\"false\" sc-camel-on-click=\"{{opt.pick}}\" style=\"min-height:44px;padding:0 20px;border-radius:999px;border:2px solid #9A5C80;background:#FFFFFF;color:#2E1A28;font:inherit;font-size:16px;cursor:pointer\">{{opt.label}}<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Ffieldset>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div aria-live=\"polite\" style=\"margin-top:32px\">\n<sc-if value=\"{{notDone}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"background:#FFFFFF;border-radius:16px;padding:24px 28px;border:2px dashed #9A5C80\">\n<p style=\"margin:0;font-weight:600\">{{answered}} of 10 answered<\u002Fp>\n<p style=\"margin:4px 0 0;font-size:17px;color:#5A3C4F\">Answer the remaining statements to see your reflection.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{showResult}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:#FFFFFF;border-radius:20px;padding:clamp(24px,4vw,40px);box-sizing:border-box\">\n<p style=\"margin:0 0 8px;font-size:14px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#B02A63\">Your reflection<\u002Fp>\n<h3 style=\"margin:0 0 12px;font-family:'Playfair Display',serif;font-weight:700;font-size:30px;line-height:1.2\">{{resultTitle}}<\u002Fh3>\n<p style=\"margin:0 0 20px\">{{resultBody}}<\u002Fp>\n<p style=\"margin:0 0 20px;font-weight:600\">{{flaggedCount}} of 10 statements were marked “Often” or “Almost always”.<\u002Fp>\n<sc-if value=\"{{hasFlagged}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin:0 0 20px\">\n<p style=\"margin:0 0 8px;font-size:17px\">Patterns worth a closer look:<\u002Fp>\n<ul style=\"margin:0;padding-left:22px\">\n<sc-for list=\"{{flagged}}\" as=\"f\" hint-placeholder-count=\"2\">\n<li style=\"margin:0 0 4px\">{{f.flag}}<\u002Fli>\n<\u002Fsc-for>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"background:#F1E8FB;border-radius:12px;padding:18px 22px;margin:0 0 24px\"><p style=\"margin:0;font-size:17px\"><strong style=\"color:#5A2D9C\">Remember:<\u002Fstrong> a single incident involving physical violence, sexual coercion, or a serious threat is enough to take seriously, whatever your answers add up to. This quiz can’t see your whole situation.<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n<a href=\"#support\" style=\"display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:999px;background:#B02A63;color:#FFFFFF;text-decoration:none;font-weight:600\">See support options<\u002Fa>\n<button type=\"button\" sc-camel-on-click=\"{{reset}}\" style=\"min-height:48px;padding:0 24px;border-radius:999px;border:2px solid #B02A63;background:#FFFFFF;color:#B02A63;font:inherit;font-weight:600;cursor:pointer\">Start over<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- SOURCES -->\n<section id=\"support\" style=\"max-width:1120px;margin:0 auto;padding:80px 24px;box-sizing:border-box\">\n<h2 style=\"margin:0 0 12px;font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(28px,3.6vw,40px);line-height:1.15;letter-spacing:-0.01em\">Want to Learn More or Get Support?<\u002Fh2>\n<p style=\"margin:0 0 36px;max-width:760px;color:#6A4A5E\">Sources referenced in this article, plus places to find help. Both organizations are US-based.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:20px\">\n<div style=\"flex:1 1 360px;min-width:0;background:#FFFFFF;border:1px solid #F0D3DF;border-radius:16px;padding:28px;box-sizing:border-box\">\n<h3 style=\"margin:0 0 16px;font-family:'Playfair Display',serif;font-weight:700;font-size:24px\">Understand relationship red flags<\u002Fh3>\n<ul style=\"margin:0;padding-left:22px\">\n<li style=\"margin:0 0 10px\"><a href=\"https://www.loveisrespect.org\" target=\"_blank\" rel=\"noopener\">Learn more about healthy, unhealthy, and abusive relationships<\u002Fa><\u002Fli>\n<li style=\"margin:0 0 10px\"><a href=\"https://www.thehotline.org\" target=\"_blank\" rel=\"noopener\">Recognize the warning signs of abuse<\u002Fa><\u002Fli>\n<li style=\"margin:0\"><a href=\"https://www.thehotline.org\" target=\"_blank\" rel=\"noopener\">What is gaslighting?<\u002Fa><\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"flex:1 1 360px;min-width:0;background:#FFFFFF;border:1px solid #F0D3DF;border-radius:16px;padding:28px;box-sizing:border-box\">\n<h3 style=\"margin:0 0 16px;font-family:'Playfair Display',serif;font-weight:700;font-size:24px\">Need help or support?<\u002Fh3>\n<ul style=\"margin:0;padding-left:22px\">\n<li style=\"margin:0 0 10px\"><a href=\"https://www.loveisrespect.org\" target=\"_blank\" rel=\"noopener\">Get relationship help from Love Is Respect<\u002Fa><\u002Fli>\n<li style=\"margin:0\"><a href=\"https://www.thehotline.org\" target=\"_blank\" rel=\"noopener\">Learn how to create a safety plan<\u002Fa><\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:36px 0 0;max-width:760px;font-size:21px;font-family:'Playfair Display',serif;font-weight:500;line-height:1.4\">You deserve care, respect, and a relationship where you can be yourself. And if you're still figuring out what that looks like, that's okay too.<\u002Fp>\n<\u002Fsection>\n\n<!-- POST FOOTER -->\n<section style=\"max-width:760px;margin:0 auto;padding:0 24px 24px;box-sizing:border-box\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:40px\">\n<span style=\"font-weight:600\">Tagged:<\u002Fspan>\n<a href=\"#top\" style=\"padding:6px 16px;border-radius:999px;background:#FCE4EE;color:#7E1B45;text-decoration:none;font-size:16px\">#redflags<\u002Fa>\n<a href=\"#top\" style=\"padding:6px 16px;border-radius:999px;background:#FCE4EE;color:#7E1B45;text-decoration:none;font-size:16px\">#toxicrelationships<\u002Fa>\n<a href=\"#top\" style=\"padding:6px 16px;border-radius:999px;background:#FCE4EE;color:#7E1B45;text-decoration:none;font-size:16px\">#selfworth<\u002Fa>\n<a href=\"#top\" style=\"padding:6px 16px;border-radius:999px;background:#FCE4EE;color:#7E1B45;text-decoration:none;font-size:16px\">#boundaries<\u002Fa>\n<\u002Fdiv>\n\n<div id=\"authors\" style=\"background:#FFFFFF;border:1px solid #F0D3DF;border-radius:24px;padding:28px;box-sizing:border-box;margin-bottom:56px\">\n<h2 style=\"margin:0 0 20px;font-family:'Playfair Display',serif;font-weight:700;font-size:26px\">Written by<\u002Fh2>\n<div style=\"display:flex;flex-wrap:wrap;gap:24px\">\n<div style=\"flex:1 1 260px;min-width:0;display:flex;gap:16px;align-items:flex-start\">\n<span aria-hidden=\"true\" style=\"flex:0 0 64px;display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:#B02A63;color:#FFFFFF;font-weight:600;font-size:22px\">PC<\u002Fspan>\n<div><p style=\"margin:0;font-family:'Playfair Display',serif;font-weight:700;font-size:20px\">Patricia Corteza<\u002Fp><p style=\"margin:4px 0 0;font-size:17px;color:#5A3C4F\">Co-author at Steady Ground. [Short bio]<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 260px;min-width:0;display:flex;gap:16px;align-items:flex-start\">\n<span aria-hidden=\"true\" style=\"flex:0 0 64px;display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:#5A2D9C;color:#FFFFFF;font-weight:600;font-size:22px\">JJ<\u002Fspan>\n<div><p style=\"margin:0;font-family:'Playfair Display',serif;font-weight:700;font-size:20px\">Janine Jarlos<\u002Fp><p style=\"margin:4px 0 0;font-size:17px;color:#5A3C4F\">Co-author at Steady Ground. [Short bio]<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<h2 style=\"margin:0 0 8px;font-family:'Playfair Display',serif;font-weight:700;font-size:28px\">Leave a comment<\u002Fh2>\n<p style=\"margin:0 0 20px;font-size:17px;color:#5A3C4F\">Your email won’t be published.<\u002Fp>\n<form style=\"display:flex;flex-direction:column;gap:16px\">\n<div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n<div style=\"flex:1 1 240px;min-width:0\"><label for=\"c-name\" style=\"display:block;margin:0 0 6px;font-weight:600;font-size:16px\">Name<\u002Flabel><input id=\"c-name\" type=\"text\" style=\"width:100%;box-sizing:border-box;min-height:48px;padding:0 14px;border:2px solid #9A5C80;border-radius:12px;background:#FFFFFF;font:inherit;font-size:17px\"><\u002Fdiv>\n<div style=\"flex:1 1 240px;min-width:0\"><label for=\"c-email\" style=\"display:block;margin:0 0 6px;font-weight:600;font-size:16px\">Email<\u002Flabel><input id=\"c-email\" type=\"email\" style=\"width:100%;box-sizing:border-box;min-height:48px;padding:0 14px;border:2px solid #9A5C80;border-radius:12px;background:#FFFFFF;font:inherit;font-size:17px\"><\u002Fdiv>\n<\u002Fdiv>\n<div><label for=\"c-msg\" style=\"display:block;margin:0 0 6px;font-weight:600;font-size:16px\">Comment<\u002Flabel><textarea id=\"c-msg\" rows=\"4\" style=\"width:100%;box-sizing:border-box;padding:12px 14px;border:2px solid #9A5C80;border-radius:12px;background:#FFFFFF;font:inherit;font-size:17px\"><\u002Ftextarea><\u002Fdiv>\n<div><button type=\"button\" style=\"min-height:48px;padding:0 28px;border-radius:999px;border:0;background:#B02A63;color:#FFFFFF;font:inherit;font-weight:600;cursor:pointer\">Post comment<\u002Fbutton><\u002Fdiv>\n<\u002Fform>\n<\u002Fsection>\n<\u002Farticle>\n\n<\u002Fmain>\n\n<footer style=\"background:#2E1A28;color:#F3D9E6\">\n<div style=\"max-width:1120px;margin:0 auto;padding:32px 24px;box-sizing:border-box;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 32px;font-size:16px\">\n<span style=\"font-family:'Playfair Display',serif;font-style:italic;font-weight:700;color:#FFFFFF\">Steady Ground<\u002Fspan>\n<span>© 2026 Steady Ground · Written by Patricia Corteza &amp; Janine Jarlos · A mock blog, for information only.<\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:7600}}\">\nclass Component extends DCLogic {\nrenderVals() {\nconst answers = (this.state && this.state.answers) || {};\nconst labels = ['Never', 'Sometimes', 'Often', 'Almost always'];\nconst defs = [\n{ id: 'q1', flag: 'Dismissing or invalidating your feelings', text: 'When I tell my partner something hurt me, they call me dramatic or too sensitive.' },\n{ id: 'q2', flag: 'Control and unreasonable jealousy', text: 'I feel I need permission, or have to explain where I’ve been, for everyday decisions.' },\n{ id: 'q3', flag: 'Doubting your own reality', text: 'After a disagreement, I leave unsure about what actually happened or what was said.' },\n{ id: 'q4', flag: 'Not taking responsibility', text: 'My partner blames me, changes the subject, or apologizes only to end the argument.' },\n{ id: 'q5', flag: 'Isolation from friends and family', text: 'I see friends and family less because my partner gets upset when I do.' },\n{ id: 'q6', flag: 'Pushing your boundaries', text: 'My partner keeps pushing after I’ve said I’m not comfortable, like checking my phone or pressuring intimacy.' },\n{ id: 'q7', flag: 'Feeling anxious, drained, or afraid', text: 'I feel anxious, drained, or on edge around my partner, rehearsing what to say.' },\n{ id: 'q8', flag: 'Apologies without lasting change', text: 'Their apologies don’t lead to real change; the same behavior comes back within days.' },\n{ id: 'q9', flag: 'Not feeling safe to be honest', text: 'I worry about being threatened, humiliated, or punished if I speak up or set a boundary.' },\n{ id: 'q10', flag: 'Losing parts of yourself', text: 'I’ve given up friendships, goals, or hobbies to keep my partner happy.' }\n];\nconst questions = defs.map((d, i) => ({\nnum: i + 1,\ntext: d.text,\noptions: labels.map((l, v) => {\nconst sel = answers[d.id] === v;\nreturn {\nlabel: l,\npressed: sel,\nunpressed: !sel,\npick: () => this.setState({ answers: { ...answers, [d.id]: v } })\n};\n})\n}));\nconst answered = defs.filter((d) => answers[d.id] !== undefined).length;\nconst flagged = defs.filter((d) => answers[d.id] >= 2).map((d) => ({ flag: d.flag }));\nconst n = flagged.length;\nlet resultTitle, resultBody;\nif (n <= 1) {\nresultTitle = 'Mostly steady ground';\nresultBody = 'Your answers don’t point to many of these patterns right now. Keep checking in with yourself, especially after disagreements: can you talk about what happened, and do you both try to understand each other?';\n} else if (n <= 4) {\nresultTitle = 'Some patterns worth noticing';\nresultBody = 'A few of these patterns show up often. One or two doesn’t make a relationship toxic, but repeated patterns are worth paying attention to. Consider talking it through with someone you trust, or with a counselor.';\n} else {\nresultTitle = 'Several patterns worth taking seriously';\nresultBody = 'Many of these patterns show up often for you. You don’t need to wait for it to get worse, and you don’t need to figure this out alone. Talking to someone you trust, or to a support service, can help you think about what you want to do next.';\n}\nreturn {\nquestions,\nanswered,\nnotDone: answered < defs.length,\nshowResult: answered === defs.length,\nresultTitle,\nresultBody,\nflagged,\nflaggedCount: n,\nhasFlagged: n > 0,\nreset: () => this.setState({ answers: {} })\n};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
